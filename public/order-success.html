<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Received – Source77 Store</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="container success-page">
    <div class="success-card">
      <div class="success-icon" aria-hidden="true">✅</div>
      <h1>Order Received!</h1>
      <p class="success-message">
        Thank you for your order. You will receive a confirmation email shortly.
      </p>
      <p class="success-session" id="session-display"></p>
      <div id="digital-downloads"></div>
      <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script defer>
    (function () {
      function escHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function init() {
        // Read the just-bought cart BEFORE clearing it — digital
        // items carry their download_url, which becomes the
        // download button below. (If the page is refreshed the
        // cart is already gone, so nothing renders — by design
        // for v1; the buyer can contact the store for the link.)
        var cart = [];
        try { cart = JSON.parse(localStorage.getItem('source77_cart')) || []; } catch (e) {}
        var digital = cart.filter(function (item) {
          return item.fulfillment === 'digital' && item.download_url;
        });
        if (digital.length) {
          var box = document.getElementById('digital-downloads');
          if (box) {
            box.innerHTML =
              '<div class="digital-download-box">' +
                '<h2>💾 Your download is ready</h2>' +
                digital.map(function (item) {
                  return '<p class="digital-download-item">' +
                    '<strong>' + escHtml(item.title || 'Digital product') + '</strong><br>' +
                    '<a href="' + escHtml(item.download_url) + '" class="btn btn-primary" download>Download now</a>' +
                  '</p>';
                }).join('') +
                '<p class="digital-download-note">Save the file — this link is shown once here. If you lose it, email info@source77llc.com with your order reference.</p>' +
              '</div>';
          }
        }
        try { localStorage.removeItem('source77_cart'); } catch (e) {}
        if (window.updateNavCartBadge) window.updateNavCartBadge();
        var sessionId = new URLSearchParams(window.location.search).get('session_id');
        if (sessionId) {
          var el = document.getElementById('session-display');
          el.textContent = 'Order reference: ' + sessionId;
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
