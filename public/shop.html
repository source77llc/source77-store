<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – Source77 Store</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="container shop-page">
    <h1 id="shop-title">Shop All Items</h1>

    <!-- Category filters (mirrors the header category strip) -->
    <div id="category-filters" class="category-filters" role="group" aria-label="Filter by category">
      <button type="button" class="filter-btn active" data-category="All">All</button>
      <button type="button" class="filter-btn" data-category="Car Parts">Car Parts</button>
      <button type="button" class="filter-btn" data-category="Home Goods">Home Goods</button>
      <button type="button" class="filter-btn" data-category="Electronics">Electronics</button>
      <button type="button" class="filter-btn" data-category="General Merchandise">General Merchandise</button>
      <button type="button" class="filter-btn" data-category="Digital Downloads">Digital Downloads</button>
    </div>

    <!-- Result count + sort -->
    <div class="shop-toolbar">
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <label class="sort-label">Sort by
        <select id="sort-select" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name">Name: A to Z</option>
        </select>
      </label>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="product-grid" aria-live="polite" aria-label="Products">
      <!-- Populated by shop.js -->
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state" hidden>
      <span class="empty-icon">&#128269;</span>
      <h3>No products found</h3>
      <p>Try a different search or category.</p>
      <button id="clear-search" class="btn btn-secondary">Clear Search &amp; Filters</button>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/shop.js" defer></script>
</body>
</html>
