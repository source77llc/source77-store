<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product – Source77 Store</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="container product-page">
    <a href="shop.html" class="back-link">&larr; Back to Shop</a>

    <div class="product-detail">
      <!-- Product Image -->
      <div class="product-image-wrap">
        <img
          id="product-image"
          src=""
          alt=""
          class="product-image"
        />
        <div id="product-thumbs" class="product-thumbs" role="group" aria-label="Product photos"></div>
      </div>

      <!-- Product Info -->
      <div class="product-info">
        <h1 id="product-title" class="product-title">Loading&hellip;</h1>

        <div class="product-meta">
          <span id="product-condition" class="condition-badge"></span>
          <span id="product-stock" class="stock-badge out-of-stock" style="display:none">Out of stock</span>
          <span id="product-price" class="product-price"></span>
        </div>

        <div id="product-fulfillment" class="fulfillment-badge local"></div>

        <div id="product-description" class="product-description"></div>

        <div id="product-weight" class="product-weight"></div>

        <!-- Add to Cart -->
        <div class="add-to-cart-row">
          <label for="qty-input" class="qty-label">Qty:</label>
          <input
            type="number"
            id="qty-input"
            class="qty-input"
            min="1"
            value="1"
            aria-label="Quantity"
          />
          <button id="add-to-cart-btn" class="btn btn-primary" disabled>
            Add to Cart
          </button>
          <button id="share-btn" type="button" class="btn btn-secondary" aria-label="Share this item">
            &#8599; Share
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script defer>
    (function () {
      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      function conditionLabel(c) {
        const map = {
          new: 'New',
          'like-new': 'Like New',
          good: 'Good',
          fair: 'Fair',
          salvage: 'Salvage / Parts',
        };
        return map[c] || c || 'Unknown';
      }

      function copyItemLink(url, btn) {
        function done() {
          var old = btn.textContent;
          btn.textContent = 'Link copied!';
          setTimeout(function () { btn.textContent = old; }, 2000);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url, done); });
        } else {
          fallbackCopy(url, done);
        }
      }
      function fallbackCopy(text, done) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        done();
      }

      function populate(product) {
        document.title = product.title + ' – Source77 Store';

        const titleEl = document.getElementById('product-title');
        const imgEl = document.getElementById('product-image');
        const condEl = document.getElementById('product-condition');
        const priceEl = document.getElementById('product-price');
        const descEl = document.getElementById('product-description');
        const weightEl = document.getElementById('product-weight');
        const fulfilEl = document.getElementById('product-fulfillment');
        const btn = document.getElementById('add-to-cart-btn');

        titleEl.textContent = product.title;

        // Images: main + thumbnail strip; a broken main image falls
        // through to the next image instead of staying broken.
        var imgs = (product.images && product.images.length)
          ? product.images.slice()
          : ((product.image_url || product.image) ? [product.image_url || product.image] : []);
        var imgIdx = 0;
        function showImage(i) {
          imgIdx = i;
          imgEl.src = imgs[i];
          imgEl.alt = product.title;
          var thumbs = document.querySelectorAll('#product-thumbs .product-thumb');
          thumbs.forEach(function (t, j) {
            t.classList.toggle('active', j === i);
            t.setAttribute('aria-current', j === i ? 'true' : 'false');
          });
        }
        imgEl.onerror = function () {
          if (imgIdx + 1 < imgs.length) { showImage(imgIdx + 1); }
          else { imgEl.style.display = 'none'; }
        };
        if (imgs.length) {
          showImage(0);
        } else {
          imgEl.style.display = 'none';
        }
        var thumbsWrap = document.getElementById('product-thumbs');
        if (thumbsWrap) {
          thumbsWrap.innerHTML = imgs.map(function (src, i) {
            return '<button type="button" class="product-thumb' + (i === 0 ? ' active' : '') +
              '" data-idx="' + i + '" aria-label="View photo ' + (i + 1) + '">' +
              '<img src="' + src.replace(/"/g, '&quot;') + '" alt="" loading="lazy"></button>';
          }).join('');
          thumbsWrap.addEventListener('click', function (e) {
            var t = e.target.closest('.product-thumb');
            if (!t) return;
            imgEl.style.display = '';
            showImage(parseInt(t.getAttribute('data-idx'), 10) || 0);
          });
        }

        condEl.textContent = conditionLabel((product.condition || '').toLowerCase());
        condEl.dataset.condition = product.condition || '';
        priceEl.textContent = '$' + Number(product.price || 0).toFixed(2);
        descEl.textContent = product.description || '';
        if (product.weight_lb) {
          weightEl.textContent = 'Shipping weight: ' + product.weight_lb + ' lbs';
        } else {
          weightEl.style.display = 'none';
        }
        if (fulfilEl) {
          if (product.fulfillment === 'direct') {
            fulfilEl.className = 'fulfillment-badge direct';
            fulfilEl.textContent = '🚚 Ships directly to you';
          } else if (product.fulfillment === 'digital') {
            fulfilEl.className = 'fulfillment-badge digital';
            fulfilEl.textContent = '💾 Instant download after payment';
          } else {
            fulfilEl.className = 'fulfillment-badge local';
            fulfilEl.textContent = '📍 Local pickup available';
          }
        }

        // Digital products: one download — quantity is always 1.
        var qtyInput = document.getElementById('qty-input');
        if (product.fulfillment === 'digital' && qtyInput) {
          qtyInput.value = 1;
          qtyInput.disabled = true;
        }

        // Out of stock: quantity is a number at or below zero.
        var outOfStock = (typeof product.quantity === 'number' && product.quantity <= 0);
        var stockEl = document.getElementById('product-stock');
        if (stockEl) stockEl.style.display = outOfStock ? '' : 'none';
        btn.disabled = outOfStock;
        btn.textContent = outOfStock ? 'Out of Stock' : 'Add to Cart';
        // (qtyInput already fetched above; digital stays disabled.)
        if (qtyInput) qtyInput.disabled = outOfStock || product.fulfillment === 'digital';
        btn.addEventListener('click', function () {
          const qty = parseInt(document.getElementById('qty-input').value, 10) || 1;
          // cart.js expected interface
          if (typeof window.addToCart === 'function') {
            window.addToCart(product, qty);
            btn.textContent = 'Added!';
            setTimeout(function () { btn.textContent = 'Add to Cart'; }, 1500);
          } else {
            // Fallback: store raw cart in localStorage
            const cart = JSON.parse(localStorage.getItem('source77_cart') || '[]');
            const existing = cart.find(function (i) { return i.id === product.id; });
            if (existing) {
              existing.qty = (product.fulfillment === 'digital') ? 1 : existing.qty + qty;
              if (product.fulfillment) existing.fulfillment = product.fulfillment;
              if (product.download_url) existing.download_url = product.download_url;
            } else {
              cart.push({
                id: product.id,
                title: product.title,
                condition: product.condition || '',
                price: product.price,
                image: (product.images && product.images[0]) || product.image_url || '',
                weightLb: (function () { var w = Number(product.weight_lb); return isNaN(w) ? 0.5 : w; })(),
                fulfillment: product.fulfillment || 'local',
                download_url: product.download_url || '',
                qty: (product.fulfillment === 'digital') ? 1 : qty
              });
            }
            localStorage.setItem('source77_cart', JSON.stringify(cart));
            btn.textContent = 'Added!';
            setTimeout(function () { btn.textContent = 'Add to Cart'; }, 1500);
          }
        });
        // Share: native share sheet on phones (WhatsApp, Messenger, SMS…),
        // otherwise copy the item link.
        var shareBtn = document.getElementById('share-btn');
        if (shareBtn) {
          shareBtn.addEventListener('click', function () {
            var url = window.location.href;
            var text = product.title + ' – $' + Number(product.price || 0).toFixed(2) + ' – Source77 Store';
            if (navigator.share) {
              navigator.share({ title: product.title, text: text, url: url }).catch(function () {});
            } else {
              copyItemLink(url, shareBtn);
            }
          });
        }
      }

      function showError(msg) {
        document.getElementById('product-title').textContent = msg;
        document.getElementById('add-to-cart-btn').style.display = 'none';
        var shareBtn = document.getElementById('share-btn');
        if (shareBtn) shareBtn.style.display = 'none';
      }

      function init() {
        var id = getParam('id');
        if (!id) { showError('No product specified.'); return; }

        // Try API if configured
        var apiBase = (window.CONFIG && window.CONFIG.API_BASE_URL) ? window.CONFIG.API_BASE_URL : null;
        if (apiBase) {
          fetch(apiBase + '/products/' + encodeURIComponent(id))
            .then(function (r) {
              if (!r.ok) throw new Error('Not found');
              return r.json();
            })
            .then(populate)
            .catch(function () { showError('Product not found.'); });
        } else {
          showError('Product not found.');
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
