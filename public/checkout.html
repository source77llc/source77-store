<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout – Source77 Store</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="container checkout-page">
    <h1>Checkout</h1>
    <div id="checkout-container" aria-live="polite">
      <section>
        <h2>Your Order</h2>
        <div id="cart-summary"></div>
      </section>
      <section>
        <h2>Delivery</h2>
        <div id="shipping-options"></div>
      </section>
      <section class="totals">
        <div class="total-row"><span>Subtotal:</span> <span id="subtotal-value">$0.00</span></div>
        <div class="total-row"><span>Shipping:</span> <span id="shipping-value">Free</span></div>
        <div class="total-row"><span>Tax (8.25%):</span> <span id="tax-value">$0.00</span></div>
        <div class="total-row grand"><span><strong>Total:</strong></span> <span id="order-total-value">$0.00</span></div>
      </section>
      <p id="checkout-error" class="error-msg" style="display:none"></p>
      <button id="pay-button" class="btn btn-primary">Pay with Card</button>
      <p class="stripe-note">Secure checkout with Stripe — you&rsquo;ll enter your name, email and address on the next step.</p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/cart.js" defer></script>
  <script src="/js/checkout.js" defer></script>
</body>
</html>
